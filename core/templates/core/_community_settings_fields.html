<p>
  <label for="{{ form.name.id_for_label }}">Name</label>
  {{ form.name }}
  {{ form.name.errors }}
</p>
<p>
  <label for="{{ form.description.id_for_label }}">Description</label>
  {{ form.description }}
  {{ form.description.errors }}
</p>
<p>
  <label for="{{ form.color.id_for_label }}">Accent color</label>
  {{ form.color }}
  {{ form.color.errors }}
</p>
{% if form.is_private %}
  <p>
    <label>{{ form.is_private }} private (members only)</label>
    {{ form.is_private.errors }}
  </p>
{% else %}
  <p class="muted">{{ privacy_locked_text }}</p>
{% endif %}
