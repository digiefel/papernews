<div class="comment">
  <div class="subtext muted">
    {{ comment.author.username }}{% if comment.author.profile.verified %} <span class="verified" title="verified">&#10003;</span>{% endif %}
    &middot; {{ comment.created|timesince }} ago
    &middot; {{ comment.vote_count }} point{{ comment.vote_count|pluralize }}
    &middot; on <a href="{{ comment.get_absolute_url }}">{{ comment.submission.title }}</a>
  </div>
  <div class="comment-body">{{ comment.body_html|safe }}</div>
</div>
